description='''
Lo que tiene que pasar, va a pasar.
Alguien empieza a visitarte. Al principio es amable. Te sigue, te oye caminar y, poco a poco, deja de estar bien.
Viaja a Valle Quieto, un pueblo en la niebla, repara el descapotable y escapa. No le hables demasiado a Mariana.
Y de noche, apaga la luz con cuidado: Diana la Zunga te mira dormir. Si alguien pregunta por Santi, es Juli: síguela hasta El Sueño.
Kevin te invita a una fiesta techno, al bosque del Alto y a unas catacumbas. En la mina, Nicolás te sigue. Y algo te mira desde lejos.
'''

